        function downloadPurchaseFormExcel() {
            const form=state.purchaseForm;
            if(!form) return showToast('請先產生單據','error');
            if(typeof XLSX==='undefined') return showToast('Excel 元件尚未載入，請重新整理後再試','error');
            const total=form.items.reduce((sum,item)=>sum+Number(item.total||Number(item.quantity)*Number(item.unitPrice)||0),0);
            const wb=XLSX.read(PURCHASE_FORM_TEMPLATE_BASE64,{type:'base64',cellStyles:true,cellFormula:true});
            const templateName=wb.SheetNames.includes('領款 (2)')?'領款 (2)':wb.SheetNames[wb.SheetNames.length-1];
            const ws=wb.Sheets[templateName];
            wb.SheetNames=['請購單'];
            wb.Sheets={'請購單':ws};
            wb.CalcPr={calcMode:'auto',fullCalcOnLoad:true,forceFullCalc:true};

            const setValue=(ref,value,type='s')=>{if(!ws[ref])ws[ref]={t:type,v:value};else{ws[ref].t=type;ws[ref].v=value;delete ws[ref].f;}};
            const setFormula=(ref,formula,value)=>{if(!ws[ref])ws[ref]={t:'n',f:formula,v:value};else{ws[ref].t='n';ws[ref].f=formula;ws[ref].v=value;}};
            setValue('A3','    月     日付款憑單     號，支出傳票    號');
            setValue('G5','應付代收款');
            setValue('G6',form.workPlan||'');
            setValue('G7',form.purposeCode||'');
            setValue('Q5',form.purposeDescription||'');
            setFormula('L5','C27',total);

            for(let i=0;i<10;i++){
                const row=17+i,item=form.items[i];
                setValue(`A${row}`,i+1,'n');
                setValue(`B${row}`,item?item.itemName:'');
                setValue(`O${row}`,item?item.unit:'');
                setValue(`Q${row}`,item?Number(item.quantity):'',item?'n':'s');
                setValue(`S${row}`,item?Number(item.unitPrice):'',item?'n':'s');
                setFormula(`V${row}`,`Q${row}*S${row}`,item?Number(item.total||Number(item.quantity)*Number(item.unitPrice)):0);
            }
            setFormula('C27','SUM(V17:V26)',total);
            setValue('G27',amountToChinese(total));
            setValue('A29',form.purposeDescription||'');
            const type=form.transaction.paymentType||'prepaid';
            const payer=form.transaction.payerName||state.currentUser?.name||'';
            setValue('A32',`${type==='vendor'?'●':'○'}逕付具領人或廠商     ${type==='prepaid'?'●':'○'}款項已由 ${payer} 先行墊付     ${type==='advance'?'●':'○'}已預借費用`);
            ws['!ref']='A1:Y32';
            XLSX.writeFile(wb,`請購單_${form.transaction.id}.xlsx`,{bookType:'xlsx',cellStyles:true});
            showToast('Excel 下載成功');
        }
        async function deleteItem(id) {
            if(!confirm('確定刪除？此動作無法復原。')) return;
            const originalList = [...state.transactions];
            const originalItems = [...state.transactionItems];
            state.transactions = state.transactions.filter(t=>String(t.id)!==String(id));
            state.transactionItems = state.transactionItems.filter(item=>String(item.transactionId)!==String(id));
            updateUI();
            try {
                showLoading(true);
                await apiCall({action:'delete', id:id});
                showToast('刪除成功');
            } catch(err) {
                state.transactions = originalList;
                state.transactionItems = originalItems;
                updateUI();
                showToast('刪除失敗：' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // 分頁功能
        function updateFilterOptions() {
            const project = document.getElementById('filter-project');
            const category = document.getElementById('filter-category');
            project.innerHTML = '<option value="ALL">全部計畫</option>' + state.projects.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');
            const names = [...new Set(state.categories.map(c => String(c.name || '')).filter(Boolean))].sort();
            category.innerHTML = '<option value="ALL">全部科目</option>' + names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
        }

        function getFilteredTransactions() {
            const from = document.getElementById('filter-date-from')?.value || '';
            const to = document.getElementById('filter-date-to')?.value || '';
            const project = document.getElementById('filter-project')?.value || 'ALL';
            const category = document.getElementById('filter-category')?.value || 'ALL';
            const keyword = (document.getElementById('filter-keyword')?.value || '').trim().toLowerCase();
            return state.transactions.filter(t => {
                const date = getSafeDate(t.date);
                const text = [t.summary, t.payee, t.note].map(v => String(v || '').toLowerCase()).join(' ');
                return (!from || date >= from) && (!to || date <= to)
                    && (project === 'ALL' || String(t.projectId) === project)
                    && (category === 'ALL' || String(t.category) === category)
                    && (!keyword || text.includes(keyword));
            });
        }

        function applyListFilters() { state.currentPage = 1; updateUI(); }

        function clearListFilters() {
            ['filter-date-from','filter-date-to','filter-keyword'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('filter-project').value = 'ALL';
            document.getElementById('filter-category').value = 'ALL';
            applyListFilters();
        }

        function nextPage() {
            const totalPages = Math.ceil(getFilteredTransactions().length / state.itemsPerPage);
            if (state.currentPage < totalPages) {
                state.currentPage++;
                updateUI();
            }
        }

        function prevPage() {
            if (state.currentPage > 1) {
                state.currentPage--;
                updateUI();
            }
        }

        function updateUI() { 
            if(!state.currentUser) return; 
            const user=state.currentUser; 
            const role = (user.role || '').toLowerCase().trim(); 
            const isAdmin = role === 'admin'; 
            
            const inc=state.transactions.filter(t=>t.type==='income').reduce((a,c)=>a+(+c.amount||0),0); 
            const exp=state.transactions.filter(t=>t.type==='expense').reduce((a,c)=>a+(+c.amount||0),0); 
            document.getElementById('total-income').innerText='$'+inc.toLocaleString(); 
            document.getElementById('total-expense').innerText='$'+exp.toLocaleString(); 
            
            const pStats=document.getElementById('project-stats'); 
            pStats.innerHTML=''; 
            const pList=document.getElementById('projects-list-content'); 
            pList.innerHTML=''; 
            
            state.projects.forEach(p=>{ 
                const budget = Number(p.budget) || 0;
                const used=state.transactions.filter(t=>String(t.projectId)===String(p.id)&&t.type==='expense').reduce((a,c)=>a+(+c.amount||0),0);
                const balance = budget - used;
                const hasBudget = budget > 0;
                const actualPct = hasBudget ? Math.round(used / budget * 100) : 0;
                const barPct = hasBudget ? Math.min(actualPct, 100) : (used > 0 ? 100 : 0);
                const balanceLabel = balance >= 0 ? '預算餘額' : '超支金額';
                const balanceAmount = Math.abs(balance);
                const balanceColor = balance >= 0 ? 'text-green-700' : 'text-red-700';
                const barColor = !hasBudget && used > 0 ? 'bg-red-700' : actualPct > 100 ? 'bg-red-700' : actualPct > 90 ? 'bg-red-600' : actualPct > 70 ? 'bg-yellow-400' : 'bg-green-500';
                const usageText = hasBudget ? `使用率 ${actualPct}%` : (used > 0 ? '尚未設定預算' : '使用率 0%');

                pStats.innerHTML+=`<div class="mb-5 rounded-lg border border-stone-200 bg-stone-50/60 p-3">
                    <div class="flex justify-between gap-3 text-sm mb-2">
                        <span class="font-bold text-stone-700">${escapeHtml(p.name)}</span>
                        <span class="text-stone-500 text-right">已支出 $${used.toLocaleString()}／預算 $${budget.toLocaleString()}</span>
                    </div>
                    <div class="bg-stone-200 rounded-full h-2.5 overflow-hidden" role="progressbar" aria-label="${escapeHtml(p.name)}預算使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${barPct}">
                        <div class="h-2.5 rounded-full ${barColor}" style="width:${barPct}%"></div>
                    </div>
                    <div class="flex justify-between gap-3 mt-2 text-xs">
                        <span class="font-bold ${actualPct > 100 || (!hasBudget && used > 0) ? 'text-red-700' : 'text-stone-500'}">${usageText}</span>
                        <span class="font-bold ${balanceColor}">${balanceLabel} $${balanceAmount.toLocaleString()}</span>
                    </div>
                </div>`; 
                pList.innerHTML+=`<div class="border border-stone-200 rounded-lg p-3 flex justify-between items-center bg-stone-50/50"><div><div class="font-bold text-stone-800">${escapeHtml(p.name)}</div><div class="text-xs text-stone-500">${escapeHtml(p.funder||'')}</div></div><div class="text-right"><div class="font-mono font-bold text-red-700">$${(Number(p.budget)||0).toLocaleString()}</div></div></div>`; 
            }); 
            
            const pSelect=document.getElementById('inp-project'); 
            const savedP=pSelect.value; 
            pSelect.innerHTML=state.projects.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join(''); 
            if(savedP)pSelect.value=savedP; 
            updateCategories(); 
            
            const sortedTransactions = getFilteredTransactions().slice().sort((a,b) => {
                const dA = new Date(a.date).getTime() || 0;
                const dB = new Date(b.date).getTime() || 0;
                if (dB !== dA) return dB - dA; 
                return (Number(b.id) || 0) - (Number(a.id) || 0);
            });
            
            const totalPages = Math.ceil(sortedTransactions.length / state.itemsPerPage);
            if (state.currentPage > totalPages && totalPages > 0) state.currentPage = totalPages;
            
            const startIndex = (state.currentPage - 1) * state.itemsPerPage;
            const endIndex = startIndex + state.itemsPerPage;
            const pageItems = sortedTransactions.slice(startIndex, endIndex);
            document.getElementById('filter-result-count').innerText = `共 ${sortedTransactions.length} 筆`;

            const tbody=document.getElementById('list-body'); 
            tbody.innerHTML=pageItems.map(t=>{ 
                const projName=state.projects.find(p=>String(p.id)===String(t.projectId))?.name||'(未知)'; 
                const safeDate = getSafeDate(t.date); // V36：使用安全日期轉換
                const safeActionId = /^[A-Za-z0-9_-]{1,100}$/.test(String(t.id || '')) ? String(t.id) : '';
                const canModify = !!safeActionId && (isAdmin || String(t.createdBy) === String(user.id));
                
                let payInfo = '';
                if (t.type === 'expense') {
                    let acc = String(t.bankAccount || '');
                    if(acc.length > 0 && acc.length < 14 && /^\d+$/.test(acc)) acc = acc.padStart(14, '0');
                    if (t.payee || acc) {
                        payInfo = `<div class="text-xs text-stone-400 mt-1 font-mono">
                            ${t.payee ? `<span class="mr-2"><i data-lucide="user" class="inline w-3 h-3"></i> ${escapeHtml(t.payee)}</span>` : ''}
                            ${acc ? `<span><i data-lucide="credit-card" class="inline w-3 h-3"></i> ${escapeHtml(acc)}</span>` : ''}
                        </div>`;
                    }
                }

                let actionBtns = '';
                if (t.type === 'expense') {
                    actionBtns += `<button onclick="showPurchaseFormPreview(state.transactions.find(t=>String(t.id)==='${safeActionId}'))" class="p-1.5 text-stone-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors" title="單據黏存單"><i data-lucide="file-text" class="w-4 h-4"></i></button>`;
                }

                if (canModify) {
                    actionBtns += `<button onclick="startEdit('${safeActionId}')" class="p-1.5 text-stone-400 hover:text-yellow-600 hover:bg-yellow-50 rounded transition-colors" title="修改"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                   <button onclick="deleteItem('${safeActionId}')" class="p-1.5 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                } else {
                    actionBtns += `<span class="p-1.5 text-stone-200" title="無權限"><i data-lucide="lock" class="w-4 h-4"></i></span>`;
                }

                return `<tr class="hover:bg-stone-50 group border-b border-stone-100 last:border-0">
                    <td class="px-4 py-3 align-top">
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="font-mono text-stone-500 text-xs">${escapeHtml(safeDate)} <span class="text-stone-300">#${escapeHtml(String(t.id).slice(-6))}</span></span>
                        </div>
                        <div class="text-xs text-stone-400 truncate max-w-[100px]">${escapeHtml(projName)}</div>
                        <div class="text-sm font-medium text-stone-800">${escapeHtml(t.summary)}</div>
                        ${payInfo}
                    </td>
                    <td class="px-4 py-3 text-right align-top">
                        <div class="font-mono font-bold ${t.type==='income'?'text-green-600':'text-red-600'}">
                            ${t.type==='income'?'+':'-'}${Number(t.amount).toLocaleString()}
                        </div>
                    </td>
                    <td class="px-4 py-3 text-center align-top">
                        <div class="flex justify-center items-center space-x-1">
                            ${actionBtns}
                        </div>
                    </td>
                </tr>`; 
            }).join(''); 
            
            document.getElementById('page-info').innerText = `第 ${state.currentPage} / ${totalPages || 1} 頁`;
            document.getElementById('btn-prev-page').disabled = state.currentPage <= 1;
            document.getElementById('btn-next-page').disabled = state.currentPage >= totalPages;

            lucide.createIcons(); 
        }

        function startEdit(id){
            const t = state.transactions.find(t => String(t.id) === String(id));
            if (!t) return showToast('找不到該筆資料', 'error');

            document.getElementById('inp-id').value=t.id;
            document.getElementById('inp-date').value = getSafeDate(t.date); // V36：使用安全日期轉換
            document.getElementById('inp-amount').value=t.amount;
            document.getElementById('inp-summary').value=t.summary;
            document.getElementById('inp-payee').value=t.payee;
            
            let bankAcc = String(t.bankAccount || '');
            if (bankAcc.length > 0 && bankAcc.length < 14) {
                bankAcc = bankAcc.padStart(14, '0');
            }
            document.getElementById('inp-bank-account').value=bankAcc;
            
            document.getElementById('inp-note').value=t.note;
            setType(t.type);
            setTimeout(()=>{
                document.getElementById('inp-project').value=t.projectId;
                document.getElementById('inp-category').value=t.category;
            },50);
            document.getElementById('form-title').innerText="修改紀錄";
            document.getElementById('edit-mode-indicator').classList.remove('hidden');
            document.getElementById('btn-submit').innerHTML='<i data-lucide="refresh-cw" class="w-5 h-5 mr-2"></i> 確認更新';
            document.getElementById('btn-submit').className='w-full bg-yellow-500 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center hover:bg-yellow-600';
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            switchTab('entry');
        }

        function cancelEdit(){
            document.getElementById('entry-form').reset();
            document.getElementById('inp-id').value="";
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            document.getElementById('inp-date').value = dateStr;
            
            document.getElementById('form-title').innerText="新增紀錄";
            document.getElementById('edit-mode-indicator').classList.add('hidden');
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            setType('expense');
        }
        
        function updateCategories(){const type=document.getElementById('inp-type').value;const cSelect=document.getElementById('inp-category');const opts=state.categories.filter(c=>c.type===type);cSelect.innerHTML=opts.map(c=>`<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');}
        function setType(t){
            document.getElementById('inp-type').value=t;
            const btnE=document.getElementById('btn-expense');
            const btnI=document.getElementById('btn-income');
            const btnS=document.getElementById('btn-submit');
            
            // 重置基本樣式
            btnE.className = 'flex-1 py-3 rounded-lg text-sm font-bold transition-all border border-transparent';
            btnI.className = 'flex-1 py-3 rounded-lg text-sm font-bold transition-all border border-transparent';

            if(t==='expense'){
                btnE.classList.add('bg-white', 'text-red-600', 'shadow-sm', 'border-stone-200');
                btnI.classList.add('text-stone-500', 'hover:text-green-600');
                
                btnS.innerHTML='<i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存紀錄';
                btnS.className='w-full bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center hover:bg-red-800 transition-colors';
            }else{
                btnI.classList.add('bg-white', 'text-green-600', 'shadow-sm', 'border-stone-200');
                btnE.classList.add('text-stone-500', 'hover:text-red-600');
                
                btnS.innerHTML='<i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存紀錄';
                btnS.className='w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center hover:bg-green-700 transition-colors';
            }
            updateCategories();
        }
        function saveAndConnect(){const url=document.getElementById('api-url-input').value.trim();if(!url)return showToast('請輸入網址','error');localStorage.setItem('tafalong_url',url);state.apiUrl=url;fetchData();}
        function showSettingsOnly(){document.getElementById('login-overlay').classList.add('hidden');switchTab('settings');}
        function logout(){
            if(!confirm('確定要登出？\n為了資訊安全，登出後將會清除連線設定。')) return;
            state.currentUser = null;
            state.token = '';
            state.transactions = [];
            state.projects = [];
            state.categories = [];
            state.transactionItems = [];
            localStorage.removeItem('tafalong_url');
            state.apiUrl = '';
            document.getElementById('login-id').value = '';
            document.getElementById('login-pwd').value = '';
            document.getElementById('login-msg').classList.add('hidden');
            document.getElementById('api-url-input').value = '';
            document.getElementById('login-overlay').classList.add('hidden');
            switchTab('settings');
            document.getElementById('navbar').classList.replace('bg-red-700','bg-stone-700');
            document.getElementById('user-display').innerText = '未登入';
            showToast('已登出並清除連線設定');
        }
        function switchTab(id){document.querySelectorAll('.view-section').forEach(el=>el.classList.add('hidden'));document.getElementById('view-'+id).classList.remove('hidden');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.replace('text-red-600','text-stone-400'));const map={'dashboard':0,'entry':1,'list':2,'projects':3};if(map[id]!==undefined&&document.querySelectorAll('.nav-btn')[map[id]])document.querySelectorAll('.nav-btn')[map[id]].classList.replace('text-stone-400','text-red-600');document.querySelectorAll('.desktop-nav-btn').forEach(b=>{b.classList.remove('text-yellow-300','bg-white/10');b.classList.add('text-red-100','hover:bg-white/10');});if(map[id]!==undefined&&document.querySelectorAll('.desktop-nav-btn')[map[id]]){const b=document.querySelectorAll('.desktop-nav-btn')[map[id]];b.classList.remove('text-red-100','hover:bg-white/10');b.classList.add('text-yellow-300','bg-white/10');}
        if(id === 'list') {
            state.currentPage = 1;
            updateUI();
        }
        }
        function showLoading(show){document.getElementById('loading').classList.toggle('hidden',!show);}
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            if (toastTimeout) clearTimeout(toastTimeout);
            t.innerText = msg;
            t.classList.remove('hidden');
            const baseClass = "fixed top-20 right-4 px-6 py-3 rounded-lg shadow-xl z-[300] text-white transition-all duration-300 transform";
            const bgClass = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            t.className = `${baseClass} ${bgClass} translate-y-0 opacity-100`;
            toastTimeout = setTimeout(() => {
                t.className = `${baseClass} ${bgClass} translate-y-[-20px] opacity-0`;
                setTimeout(() => {
                    t.classList.add('hidden');
                }, 300);
            }, 5000);
        }
    </script>
</body>
</html>
