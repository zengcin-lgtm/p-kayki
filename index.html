<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花蓮縣太巴塱國民小學附設幼兒園 - 記帳系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 html2pdf 用於產生 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- 引入 xlsx-js-style，用於產生保留版面的 Excel -->
    <script src="https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <!-- 引入 JSZip，用於依 Word 範本產生 DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f5f5f4; /* Stone-100 暖色背景 */ }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* 阿美族風格編織飾帶 (CSS 模擬) */
        .amis-strip {
            height: 8px;
            width: 100%;
            background: repeating-linear-gradient(
                90deg,
                #dc2626, /* 紅 */
                #dc2626 20px,
                #ffffff 20px, /* 白間隔 */
                #ffffff 24px,
                #16a34a 24px, /* 綠 */
                #16a34a 44px,
                #ffffff 44px, /* 白間隔 */
                #ffffff 48px,
                #facc15 48px, /* 黃 */
                #facc15 68px,
                #ffffff 68px, /* 白間隔 */
                #ffffff 72px,
                #000000 72px, /* 黑 */
                #000000 92px,
                #ffffff 92px, /* 白間隔 */
                #ffffff 96px
            );
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 螢幕預覽樣式 */
        .preview-table { width: 100%; border-collapse: collapse; border: 2px solid #57534e; margin-bottom: 20px; }
        .preview-table th, .preview-table td { border: 1px solid #78716c; padding: 6px 8px; font-size: 14px; }
        .preview-table th { background-color: #e7e5e4; text-align: center; font-weight: bold; color: #44403c; }
        .amount-col { text-align: right; font-family: monospace; }
        
        /* PDF 輸出專用調整 */
        .pdf-content {
            font-size: 12pt;
            line-height: 1.5;
        }
        
        /* 預算統計資訊區塊 */
        .budget-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #fafaf9;
            border: 1px solid #d6d3d1;
            font-size: 0.9em;
        }
        .budget-item {
            text-align: center;
        }
        .budget-label {
            font-size: 0.8em;
            color: #78716c;
        }
        .budget-value {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.1em;
        }

        .expense-report-wrap { font-family: "DFKai-SB", "BiauKai", "KaiTi", "STKaiti", serif; color:#000; }
        .expense-report-page { width: 190mm; min-height: 277mm; padding: 4mm 3mm; box-sizing: border-box; background:#fff; page-break-after: always; }
        .expense-report-page:last-child { page-break-after: auto; }
        .expense-report-title { text-align:center; font-size:20pt; font-weight:700; letter-spacing:.2em; margin:0 0 2mm; }
        .expense-report-meta { display:flex; justify-content:space-between; font-size:12pt; margin-bottom:2mm; }
        .expense-detail-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:10.5pt; line-height:1.15; }
        .expense-detail-table th, .expense-detail-table td { border:.5pt solid #000; padding:1.2mm .8mm; vertical-align:middle; }
        .expense-detail-table th { background:#fff; color:#000; font-weight:400; text-align:center; }
        .expense-detail-table .report-section { font-size:12pt; letter-spacing:.45em; font-weight:700; }
        .expense-detail-table .report-row td { height:7.1mm; }
        .expense-detail-table .digit-cell { text-align:center; padding-left:0; padding-right:0; }
        .expense-signatures { display:grid; grid-template-columns:repeat(4,1fr); margin-top:7mm; font-size:12pt; text-align:center; }
        .expense-signatures div { min-height:20mm; }

        .purchase-form-wrap { font-family:"DFKai-SB","BiauKai","KaiTi","STKaiti",serif; color:#000; }
        .purchase-form-page { width:190mm; min-height:277mm; padding:4mm 7mm; box-sizing:border-box; background:#fff; }
        .purchase-binding { position:relative; height:5mm; margin-bottom:1mm; border-bottom:.5pt solid #000; text-align:center; letter-spacing:26mm; padding-left:25mm; font-size:11.5pt; line-height:6mm; }
        .purchase-title { text-align:center; font-size:18pt; font-weight:400; letter-spacing:.08em; margin:0 0 1mm; }
        .purchase-subtitle { text-align:center; font-size:11.5pt; margin:-1mm 0 .5mm; }
        .purchase-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:11.5pt; line-height:1.15; }
        .purchase-table th,.purchase-table td { border:.5pt solid #000; padding:.7mm; vertical-align:middle; font-weight:400; }
        .purchase-table th { text-align:center; letter-spacing:.12em; }
        /* 相鄰表格共用同一條框線，避免上下各畫 0.5pt 後疊成粗線 */
        .purchase-top-table + .purchase-table tr:first-child > *,
        .purchase-detail-table + .purchase-bottom-table tr:first-child > * { border-top:0; }
        .purchase-top-table .purchase-main-row { height:7mm; }
        .purchase-sign-label { height:7mm; text-align:center; font-size:14pt; white-space:nowrap; letter-spacing:0!important; word-break:keep-all; }
        .purchase-sign-cell { height:11mm; vertical-align:top!important; text-align:center; }
        .purchase-dash-line { height:25mm; box-sizing:border-box; border-top:.5pt solid #000; border-bottom:.5pt solid #000; margin:2mm 0 0; padding-top:1mm; text-align:center; font-size:11.5pt; letter-spacing:8mm; }
        .purchase-lower-title { text-align:center; font-size:16pt; font-weight:400; letter-spacing:.08em; margin:0; height:9mm; line-height:9mm; border:.5pt solid #000; border-bottom:0; }
        .purchase-detail-table { font-size:14pt; }
        .purchase-item-row td { height:7.5mm; }
        .purchase-total-row td { height:8mm; }
        .purchase-purpose-cell { height:21mm; vertical-align:top!important; text-align:right; font-size:11pt; }
        .purchase-bottom-sign { height:21mm; vertical-align:top!important; }
        .purchase-bottom-table th:not(:first-child) { font-size:14pt; white-space:nowrap; letter-spacing:0!important; word-break:keep-all; }
        .purchase-no-wrap { white-space:nowrap; letter-spacing:0!important; word-break:keep-all; }
        .purchase-work-plan-value { font-size:8pt; }
        .purchase-purpose-value { font-size:11pt; }
        .purchase-payment-line { font-size:11.5pt; margin-top:1mm; white-space:nowrap; }
    </style>
</head>
<body class="text-stone-800 pb-24 md:pb-10">

    <!-- Login -->
    <div id="login-overlay" class="fixed inset-0 bg-stone-800/90 z-[150] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
            <!-- 阿美風格頂部飾帶 -->
            <div class="amis-strip"></div>
            <div class="p-8">
                <div class="text-center mb-8">
                    <!-- 圖示改為紅色系 -->
                    <div class="bg-red-50 p-4 rounded-full inline-block mb-4 ring-4 ring-red-100"><i data-lucide="sun" class="w-10 h-10 text-red-600"></i></div>
                    <h1 class="text-2xl font-bold text-stone-800 tracking-wider">太巴塱附幼<br><span class="text-red-600">記帳系統 V36.7</span></h1>
                </div>
                <form id="login-form" class="space-y-5">
                    <div><label class="text-xs font-bold text-stone-500 uppercase ml-1">帳號</label><input type="text" id="login-id" class="w-full p-3 border border-stone-300 rounded-lg outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors" placeholder="user"></div>
                    <div><label class="text-xs font-bold text-stone-500 uppercase ml-1">密碼</label><input type="password" id="login-pwd" class="w-full p-3 border border-stone-300 rounded-lg outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors" placeholder="••••"></div>
                    <!-- 按鈕改為阿美紅 -->
                    <button type="submit" id="btn-login" class="w-full bg-red-700 text-white font-bold py-3 rounded-xl hover:bg-red-800 transition-all flex justify-center items-center shadow-lg transform active:scale-95">登入系統</button>
                </form>
                <div id="login-msg" class="mt-4 text-center text-red-600 text-sm font-bold hidden bg-red-50 p-2 rounded"></div>
                <div class="mt-6 pt-6 border-t border-stone-100 text-center"><button onclick="showSettingsOnly()" class="text-stone-400 text-xs hover:text-red-600 font-medium">設定連線</button></div>
            </div>
            <!-- 底部飾帶 -->
            <div class="h-2 w-full bg-stone-100"></div>
        </div>
    </div>

    <!-- Nav -->
    <!-- 導覽列改為深紅色，象徵熱情與力量 -->
    <nav id="navbar" class="bg-red-700 text-white shadow-lg sticky top-0 z-50 transition-colors duration-300 no-print">
        <!-- 頂部加入細的阿美編織紋 -->
        <div class="amis-strip" style="height: 4px;"></div>
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-lg text-white backdrop-blur-sm border border-white/20"><i data-lucide="mountain" class="w-6 h-6"></i></div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide hidden md:block text-white text-shadow">花蓮縣太巴塱國民小學附設幼兒園</h1>
                    <h1 class="text-lg font-bold tracking-wide md:hidden text-white">太巴塱附幼記帳</h1>
                    <div id="user-badge" class="flex items-center space-x-2 text-xs opacity-90 text-red-100"><i data-lucide="user" class="w-3 h-3"></i><span id="user-display">未登入</span></div>
                </div>
            </div>
            <div class="hidden md:flex space-x-2 bg-red-800/50 p-1 rounded-lg border border-red-600/30">
                <button onclick="switchTab('dashboard')" class="desktop-nav-btn px-4 py-2 rounded-md text-sm font-bold text-yellow-300 bg-white/10">總覽</button>
                <button onclick="switchTab('entry')" class="desktop-nav-btn px-4 py-2 rounded-md text-sm font-bold text-red-100 hover:bg-white/10">記帳</button>
                <button onclick="switchTab('list')" class="desktop-nav-btn px-4 py-2 rounded-md text-sm font-bold text-red-100 hover:bg-white/10">明細</button>
                <button onclick="switchTab('projects')" class="desktop-nav-btn px-4 py-2 rounded-md text-sm font-bold text-red-100 hover:bg-white/10">計畫</button>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="switchTab('settings')" class="p-2 hover:bg-white/10 rounded-full border border-white/20 text-red-100"><i data-lucide="settings" class="w-5 h-5"></i></button>
                <button onclick="logout()" class="p-2 hover:bg-red-900 rounded-full border border-white/20 text-red-100" title="登出"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6 no-print">
        <!-- Settings -->
        <div id="view-settings" class="view-section hidden fade-in">
            <div class="bg-white rounded-2xl shadow-md p-6 border-t-4 border-red-600 max-w-xl mx-auto mt-6">
                <h2 class="text-xl font-bold text-stone-700 mb-4 flex items-center"><i data-lucide="link" class="w-6 h-6 mr-2 text-red-600"></i> 連線設定</h2>
                <input type="text" id="api-url-input" placeholder="Google Apps Script URL" class="w-full p-3 border border-stone-300 rounded-lg mb-4 focus:ring-1 focus:ring-red-500 focus:border-red-500">
                <button onclick="saveAndConnect()" class="w-full bg-red-700 text-white font-bold py-3 rounded-lg hover:bg-red-800 shadow-md">儲存並連線</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="view-dashboard" class="view-section hidden fade-in">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <!-- 卡片改為暖色系與邊框強調 -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200 relative overflow-hidden">
                    <div class="absolute right-0 top-0 h-full w-2 bg-green-600"></div> <!-- 綠色飾條 -->
                    <p class="text-xs font-bold text-stone-500 mb-1 uppercase tracking-wider">本期總收入</p>
                    <p id="total-income" class="text-3xl font-bold text-stone-800 font-mono">$0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200 relative overflow-hidden">
                    <div class="absolute right-0 top-0 h-full w-2 bg-red-600"></div> <!-- 紅色飾條 -->
                    <p class="text-xs font-bold text-stone-500 mb-1 uppercase tracking-wider">本期總支出</p>
                    <p id="total-expense" class="text-3xl font-bold text-stone-800 font-mono">$0</p>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border border-stone-200">
                <h3 class="font-bold text-stone-700 mb-4 flex items-center"><i data-lucide="pie-chart" class="w-5 h-5 mr-2 text-red-600"></i> 計畫預算使用率</h3>
                <div id="project-stats" class="space-y-5"></div>
            </div>
        </div>

        <!-- Entry Form -->
        <div id="view-entry" class="view-section hidden fade-in">
            <div class="bg-white rounded-2xl shadow-lg border border-stone-100 max-w-2xl mx-auto relative overflow-hidden">
                <div class="amis-strip" style="height: 6px;"></div> <!-- 裝飾條 -->
                
                <div id="edit-mode-indicator" class="hidden absolute top-2 right-0 bg-yellow-400 text-black text-xs font-bold px-3 py-1 rounded-l-lg shadow-sm">修改模式</div>
                
                <div class="p-6 pt-8">
                    <h2 class="text-xl font-bold text-stone-800 mb-6 flex items-center justify-center border-b pb-4 border-stone-100">
                        <span class="bg-red-100 text-red-700 p-2 rounded-full mr-3"><i data-lucide="pen-tool" class="w-5 h-5"></i></span>
                        <span id="form-title">新增紀錄</span>
                    </h2>
                    <form id="entry-form" class="space-y-5">
                        <div class="flex bg-stone-100 p-1.5 rounded-xl">
                            <button type="button" onclick="setType('expense')" id="btn-expense" class="flex-1 py-3 rounded-lg text-sm font-bold bg-white text-red-600 shadow-sm transition-all border border-stone-200">支出</button>
                            <button type="button" onclick="setType('income')" id="btn-income" class="flex-1 py-3 rounded-lg text-sm font-bold text-stone-500 transition-all hover:text-green-600">收入</button>
                        </div>
                        <input type="hidden" id="inp-type" value="expense"><input type="hidden" id="inp-id" value="">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="inp-date" required class="w-full p-3 border border-stone-300 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-stone-50/50">
                            <input type="number" id="inp-amount" required min="1" max="1000000000000" step="1" placeholder="金額" class="w-full p-3 border border-stone-300 rounded-lg font-mono text-lg focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-stone-50/50">
                        </div>
                        <select id="inp-project" required class="w-full p-3 border border-stone-300 rounded-lg bg-white focus:border-red-500 focus:ring-1 focus:ring-red-500"></select>
                        <select id="inp-category" required class="w-full p-3 border border-stone-300 rounded-lg bg-white focus:border-red-500 focus:ring-1 focus:ring-red-500"></select>
                        <input type="text" id="inp-summary" required maxlength="200" placeholder="摘要" class="w-full p-3 border border-stone-300 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="inp-payee" maxlength="100" placeholder="對象 (受款人)" class="w-full p-3 border border-stone-300 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500">
                            <input type="text" id="inp-bank-account" placeholder="匯款帳號 (14碼)" maxlength="14" class="w-full p-3 border border-stone-300 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500" onblur="autoPadAccount(this)">
                        </div>
                        <input type="text" id="inp-note" maxlength="500" placeholder="備註" class="w-full p-3 border border-stone-300 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500">
                        
                        <div class="flex space-x-3 pt-2">
                            <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="hidden w-1/3 bg-stone-200 text-stone-600 font-bold py-4 rounded-xl hover:bg-stone-300">取消</button>
                            <button type="submit" id="btn-submit" class="w-full bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center hover:bg-red-800 transition-colors"><i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存紀錄</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- List -->
        <div id="view-list" class="view-section hidden fade-in">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-4 border-l-4 border-red-600">
                <h3 class="font-bold text-stone-700 text-lg">收支明細</h3>
                <button onclick="openReportModal()" class="bg-stone-800 text-white px-4 py-2 rounded-lg flex items-center font-bold text-sm hover:bg-black shadow-md transition-colors">
                    <i data-lucide="printer" class="w-4 h-4 mr-2"></i> 下載報表 (PDF)
                </button>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-stone-200">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <input type="date" id="filter-date-from" onchange="applyListFilters()" class="p-2 border border-stone-300 rounded-lg text-sm" title="起始日期">
                    <input type="date" id="filter-date-to" onchange="applyListFilters()" class="p-2 border border-stone-300 rounded-lg text-sm" title="結束日期">
                    <select id="filter-project" onchange="applyListFilters()" class="p-2 border border-stone-300 rounded-lg text-sm"><option value="ALL">全部計畫</option></select>
                    <select id="filter-category" onchange="applyListFilters()" class="p-2 border border-stone-300 rounded-lg text-sm"><option value="ALL">全部科目</option></select>
                    <input type="search" id="filter-keyword" oninput="applyListFilters()" placeholder="搜尋摘要、受款人、備註" class="p-2 border border-stone-300 rounded-lg text-sm">
                </div>
                <div class="flex justify-between items-center mt-3">
                    <span id="filter-result-count" class="text-xs font-bold text-stone-500">共 0 筆</span>
                    <button onclick="clearListFilters()" class="text-xs font-bold text-red-700 hover:text-red-900">清除篩選</button>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-stone-200 min-h-[300px]">
                <table class="w-full text-sm text-left">
                    <thead class="bg-stone-100 text-stone-600 font-bold border-b border-stone-200"><tr><th class="px-4 py-3">內容</th><th class="px-4 py-3 text-right">金額</th><th class="px-4 py-3 text-center w-[100px]">操作</th></tr></thead>
                    <tbody id="list-body" class="divide-y divide-stone-100"></tbody>
                </table>
                <!-- 分頁控制項 -->
                <div id="pagination-controls" class="flex justify-between items-center px-4 py-3 bg-stone-50 border-t border-stone-200">
                    <button onclick="prevPage()" id="btn-prev-page" class="px-3 py-1 bg-white border border-stone-300 rounded text-stone-600 hover:bg-stone-100 disabled:opacity-50 disabled:cursor-not-allowed flex items-center text-xs font-bold shadow-sm">
                        <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> 上一頁
                    </button>
                    <span id="page-info" class="text-xs font-bold text-stone-500 bg-stone-200 px-2 py-1 rounded">第 1 頁</span>
                    <button onclick="nextPage()" id="btn-next-page" class="px-3 py-1 bg-white border border-stone-300 rounded text-stone-600 hover:bg-stone-100 disabled:opacity-50 disabled:cursor-not-allowed flex items-center text-xs font-bold shadow-sm">
                        下一頁 <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Projects -->
        <div id="view-projects" class="view-section hidden fade-in">
             <div class="bg-white rounded-2xl shadow-md p-6 border border-stone-200">
                <h2 class="text-xl font-bold text-stone-700 mb-4 flex items-center"><i data-lucide="list" class="w-6 h-6 mr-2 text-red-600"></i> 計畫列表</h2>
                <div id="projects-list-content" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- Report Modal -->
    <div id="report-modal" class="fixed inset-0 bg-stone-900/80 z-[200] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md max-h-[92vh] overflow-y-auto rounded-2xl shadow-2xl fade-in">
             <div class="amis-strip" style="height: 6px;"></div>
             <div class="p-6">
                <h3 class="text-xl font-bold text-stone-800 mb-4 border-b border-stone-200 pb-2 flex items-center"><i data-lucide="file-text" class="w-5 h-5 mr-2 text-red-600"></i> 產出財務報表</h3>
                <div class="space-y-4">
                    <div><label class="block text-sm font-bold text-stone-600 mb-1">篩選計畫</label><select id="rpt-project" class="w-full p-2 border border-stone-300 rounded bg-white focus:border-red-500 outline-none"><option value="ALL">全部計畫</option></select></div>
                    
                    <!-- 修正區塊：報表期間選擇 -->
                    <div>
                        <label class="block text-sm font-bold text-stone-600 mb-1">報表期間模式</label>

        <button onclick="switchTab('entry')" class="nav-btn text-stone-400 flex flex-col items-center p-2 w-full"><i data-lucide="plus-circle" class="w-6 h-6"></i><span class="text-[10px]">記帳</span></button>
        <button onclick="switchTab('list')" class="nav-btn text-stone-400 flex flex-col items-center p-2 w-full"><i data-lucide="table" class="w-6 h-6"></i><span class="text-[10px]">明細</span></button>
        <button onclick="switchTab('projects')" class="nav-btn text-stone-400 flex flex-col items-center p-2 w-full"><i data-lucide="list" class="w-6 h-6"></i><span class="text-[10px]">計畫</span></button>

    <script>
        // V36.7：單據新增 A4 DOCX 下載，保留 PDF 下載
        let state = { 
            apiUrl: '', 
            token: '',
            transactions: [], 
            projects: [], 
            categories: [],
            transactionItems: [],
            pendingRecord: null,
            purchaseForm: null,
            currentUser: null,
            currentPage: 1,
            itemsPerPage: 15
        };
        let toastTimeout;

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>'"]/g, ch => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
            })[ch]);
        }

        window.onload = () => {
            lucide.createIcons();
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            document.getElementById('inp-date').value = dateStr;
            
            const savedUrl = localStorage.getItem('tafalong_url');
            if (savedUrl) { state.apiUrl = savedUrl; document.getElementById('api-url-input').value = savedUrl; fetchData(false); }
            else { document.getElementById('login-overlay').classList.add('hidden'); switchTab('settings'); }
        };

        // V36：日期安全轉換函式（避免時區造成日期偏移）
        function getSafeDate(val) {
            if(!val) return '';
            const d = new Date(val);
            if(isNaN(d.getTime())) return '';
            // 直接取用瀏覽器當地的年月日，避免 UTC 時差導致的日期偏移
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function autoPadAccount(el) {
            let val = el.value.trim();
            if (val.length > 0 && val.length < 14 && /^\d+$/.test(val)) {
                el.value = val.padStart(14, '0');
            }
        }

        async function apiCall(payload) {
            if (!state.apiUrl) throw new Error("未設定連線網址");
            if (state.token && payload.action !== 'login' && payload.action !== 'ping') payload.token = state.token;
            
            const res = await fetch(state.apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            
            if (!res.ok) throw new Error(`Server Error: ${res.status}`);
            const data = await res.json();
            if (data.status === 'error') {
                if (String(data.message || '').includes('登入已失效')) {
                    state.token = '';
                    state.currentUser = null;
                    document.getElementById('login-overlay').classList.remove('hidden');
                }
                throw new Error(data.message || '操作失敗');
            }
            return data;
        }

        async function fetchData() {
            showLoading(true);
            try {
                await apiCall({action:'ping'});
                document.getElementById('login-overlay').classList.remove('hidden'); 
                showToast('已連線');
            } catch (e) { 
                console.error(e);
                showToast('連線失敗: ' + e.message, 'error'); 
                document.getElementById('login-overlay').classList.add('hidden'); 
                switchTab('settings'); 
            } finally { 
                showLoading(false); 
            }
        }

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim(); 
            const pwd = document.getElementById('login-pwd').value.trim();
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            try {
                const data = await apiCall({action:'login', id:id, password:pwd});
                state.token = data.token;
                state.currentUser = data.user;
                state.projects = data.projects || [];
                state.transactions = data.transactions || [];
                state.categories = data.categories || [];
                state.transactionItems = data.transactionItems || [];
                document.getElementById('login-overlay').classList.add('hidden');
                updateFilterOptions();
                updateUI(); switchTab('dashboard'); showToast(`歡迎 ${data.user.name}`);
                document.getElementById('user-display').innerText = `${data.user.name} (${data.user.role})`;
                document.getElementById('navbar').classList.replace('bg-stone-700', 'bg-red-700');
                document.getElementById('login-msg').classList.add('hidden');
                document.getElementById('login-pwd').value = '';
            } catch (err) {
                document.getElementById('login-msg').innerText = err.message;
                document.getElementById('login-msg').classList.remove('hidden');
            } finally { btn.disabled = false; }
        };

        // --- PDF Generation Logic ---
        function downloadCurrentPDF() {
            const element = document.getElementById('print-content');
            const isLandscape = document.getElementById('print-content').classList.contains('landscape-content');
            const isFineLineReport = ['expense-detail','purchase-form'].includes(state.currentReportType);
            
            const opt = {
                margin:       [5, 5, 5, 5],
                filename:     state.currentReportType === 'expense-detail'
                    ? `費用結報明細表_${new Date().toISOString().slice(0,10)}.pdf`
                    : state.currentReportType === 'purchase-form'
                        ? `單據黏存單_${state.purchaseForm?.transaction?.id || new Date().toISOString().slice(0,10)}.pdf`
                        : `tafalong_report_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        isFineLineReport ? { type: 'png', quality: 1 } : { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: isFineLineReport ? 4 : 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: isLandscape ? 'landscape' : 'portrait', precision: 16 }
            };

            showLoading(true);
            html2pdf().set(opt).from(element).save().then(() => {
                showLoading(false);
                showToast('下載成功');
            }).catch(err => {
                showLoading(false);
                showToast('PDF 產生失敗', 'error');
                console.error(err);
            });
        }

        // 新增：更新報表輸入介面
        function updateReportInputs() {
            const mode = document.getElementById('rpt-mode').value;
            const mWrap = document.getElementById('rpt-input-month-wrapper');
            const yWrap = document.getElementById('rpt-input-year-wrapper');
            const cWrap = document.getElementById('rpt-input-custom-wrapper');
            const yHint = document.getElementById('rpt-year-hint');
            const yInput = document.getElementById('rpt-year-input');
            
            if (mode === 'month') {
                mWrap.classList.remove('hidden');
                yWrap.classList.add('hidden');
                cWrap.classList.add('hidden');
            } else if (mode === 'custom') {
                mWrap.classList.add('hidden');
                yWrap.classList.add('hidden');
                cWrap.classList.remove('hidden');
            } else {
                mWrap.classList.add('hidden');
                yWrap.classList.remove('hidden');
                cWrap.classList.add('hidden');
                
                const currentYear = new Date().getFullYear();
                if(!yInput.value) yInput.value = currentYear;

                if (mode === 'year') {
                    yHint.innerText = '範圍：1月1日 至 12月31日';
                } else {
                    // 全學年
                    const minguo = (parseInt(yInput.value) || currentYear) - 1911;
                    yHint.innerText = `範圍：${minguo}學年度 (該年8月1日 至 次年7月31日)`;
                    
                    // 綁定輸入事件動態更新民國年提示
                    yInput.oninput = function() {
                        const y = parseInt(this.value) || 0;
                        if(y > 1911) {
                            yHint.innerText = `範圍：${y-1911}學年度 (該年8月1日 至 次年7月31日)`;
                        }
                    };
                }
            }
        }

        function downloadCurrentOfficeFile() {
            if (state.currentReportType === 'purchase-form') return downloadPurchaseFormDocx();
            return downloadExpenseReportExcel();
        }

        function setOfficeDownloadButton(type) {
            const button=document.getElementById('btn-download-excel');
            button.innerHTML=type==='docx'
                ? '<i data-lucide="file-text" class="w-5 h-5 mr-2"></i> 儲存 DOCX'
                : '<i data-lucide="file-spreadsheet" class="w-5 h-5 mr-2"></i> 儲存 Excel';
            button.classList.remove('hidden');
            lucide.createIcons();
        }

        function updateReportTypeInputs() {
            const type = document.querySelector('input[name="rpt-type"]:checked')?.value;
            document.getElementById('expense-report-name-wrapper').classList.toggle('hidden', type !== 'expense-detail');
        }

        function openReportModal() {
            const sel = document.getElementById('rpt-project');
            sel.innerHTML = '<option value="ALL">全部計畫 (All Projects)</option>' + state.projects.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');
            
            // 初始化狀態
            document.getElementById('rpt-mode').value = 'month';
            document.getElementById('rpt-month-input').value = new Date().toISOString().slice(0, 7);
            document.getElementById('rpt-year-input').value = new Date().getFullYear();
            const today = new Date();
            const localToday = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            document.getElementById('rpt-start-date').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
            document.getElementById('rpt-end-date').value = localToday;
            document.querySelector('input[name="rpt-type"][value="journal"]').checked = true;
            document.getElementById('rpt-custom-project-name').value = '';
            
            updateReportInputs();
            updateReportTypeInputs();
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function generateReport() {
            const projId = document.getElementById('rpt-project').value;
            const mode = document.getElementById('rpt-mode').value;
            const type = document.querySelector('input[name="rpt-type"]:checked').value;
            
            let periodText = "";
            let startDate = "";
            let endDate = "";

            // 判斷日期範圍
            if (mode === 'month') {
                const mVal = document.getElementById('rpt-month-input').value;
                if(!mVal) return showToast('請選擇月份', 'error');
                periodText = mVal;
                startDate = mVal + "-01"; 
                const [monthYear, monthNumber] = mVal.split('-').map(Number);
                endDate = `${mVal}-${String(new Date(monthYear, monthNumber, 0).getDate()).padStart(2,'0')}`;
            } else if (mode === 'year') {
                const yVal = document.getElementById('rpt-year-input').value;
                if(!yVal) return showToast('請輸入年份', 'error');
                startDate = `${yVal}-01-01`;
                endDate = `${yVal}-12-31`;
                periodText = `${yVal} 全年度`;
            } else if (mode === 'academic') {
                const yVal = parseInt(document.getElementById('rpt-year-input').value);
                if(!yVal) return showToast('請輸入開始年份', 'error');
                startDate = `${yVal}-08-01`;
                endDate = `${yVal + 1}-07-31`;
                const minguo = yVal - 1911;
                periodText = `${minguo}學年度 (${yVal}/08 - ${yVal+1}/07)`;
            } else if (mode === 'custom') {
                startDate = document.getElementById('rpt-start-date').value;
                endDate = document.getElementById('rpt-end-date').value;
                if (!startDate || !endDate) return showToast('請選擇開始與結束日期', 'error');
                if (startDate > endDate) return showToast('開始日期不可晚於結束日期', 'error');
                periodText = `${startDate} 至 ${endDate}`;
            }

            let filtered = state.transactions.filter(t => {
                const safeDate = getSafeDate(t.date); // V36：使用安全日期轉換
                const matchProject = (projId === 'ALL') || (String(t.projectId) === String(projId));
                
                if (!matchProject) return false;

                if (mode === 'month') {
                    return safeDate.startsWith(document.getElementById('rpt-month-input').value);
                } else {
                    return safeDate >= startDate && safeDate <= endDate;
                }
            });
            
            filtered.sort((a,b) => new Date(a.date) - new Date(b.date));

            const projName = projId === 'ALL' ? '全部計畫' : (state.projects.find(p=>String(p.id)===String(projId))?.name || projId);
            const rptName = type==='journal'?'日記帳':type==='ledger'?'分類帳':type==='expense-detail'?'費用結報明細表':'收支月報表';
            
            // 計算預算資訊 (Budget Calculation)
            let totalBudget = 0;
            // Removed global calculation
            
            if (type === 'expense-detail' || projId === 'ALL') {
                totalBudget = state.projects.reduce((sum, p) => sum + (Number(p.budget) || 0), 0);
            } else {
                const p = state.projects.find(x => String(x.id) === String(projId));
                totalBudget = Number(p ? p.budget : 0);
            }

            // 修改：累計支出現在只計算「篩選後的資料」(即報表期間內)
            const totalUsedInPeriod = filtered
                .filter(t => t.type === 'expense')

            if (type === 'expense-detail') {

                    <!-- 修改標籤文字為期間總支出 -->
                    <div class="budget-item"><div class="budget-label">期間總支出</div><div class="budget-value text-red-600">$${totalUsedInPeriod.toLocaleString()}</div></div>
                    <div class="budget-item"><div class="budget-label">預算餘額</div><div class="budget-value ${remainingBudget >= 0 ? 'text-green-600' : 'text-red-600'}">$${remainingBudget.toLocaleString()}</div></div>
                </div>`;

            else if (type === 'journal') {
                html += `<table class="preview-table"><thead><tr><th>日期</th><th>計畫</th><th>科目</th><th>摘要</th><th class="text-right">收入</th><th class="text-right">支出</th></tr></thead><tbody>`;
                let sIn=0, sOut=0;
                filtered.forEach(t => {

                });
                html += `<tr style="font-weight:bold;background:#fafaf9"><td colspan="4" class="text-right">合計：</td><td class="amount-col">${sIn.toLocaleString()}</td><td class="amount-col">${sOut.toLocaleString()}</td></tr></tbody></table><div class="text-right font-bold mt-2">期間結餘：$${(sIn-sOut).toLocaleString()}</div>`;
            } else if (type === 'ledger') {

                    txs.forEach(t => { const safeDate = getSafeDate(t.date); // V36：使用安全日期轉換
                        html += `<tr><td>${escapeHtml(safeDate)}</td><td>${escapeHtml(t.summary)}</td><td>${escapeHtml(state.projects.find(p=>String(p.id)===String(t.projectId))?.name||'')}</td><td class="amount-col">${Number(t.amount).toLocaleString()}</td></tr>`; });
                    html += `<tr style="font-weight:bold"><td colspan="3" class="text-right">小計：</td><td class="amount-col">$${total.toLocaleString()}</td></tr></tbody></table>`;

        function formatRocDate(isoDate) {
            if (!isoDate) return '';
            const [y,m,d] = isoDate.split('-').map(Number);
            return `${y-1911}年${m}月${d}日`;
        }

        function getAmountDigits(amount) {
            const value = Math.max(0, Math.round(Number(amount) || 0));
            const digits = String(value).padStart(9, '0').slice(-9).split('');
            const firstNonZero = digits.findIndex(d => d !== '0');
            return digits.map((d, index) => firstNonZero === -1 ? (index === 8 ? '0' : '') : (index < firstNonZero ? '' : d));
        }

        function buildExpensePageHtml(rows, pageIndex, pageCount, report) {
            const rowsPerPage = 19;
            const paddedRows = rows.concat(Array.from({length: rowsPerPage - rows.length}, () => null));
            const isLastPage = pageIndex === pageCount - 1;
            const pageSubtotal = rows.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);
            const totalForRow = isLastPage ? report.totalAmount : pageSubtotal;
            const totalLabel = isLastPage ? '合計' : '本頁小計';
            const digitHeaders = ['億','仟','佰','拾','萬','仟','佰','拾','元'];

            return `<section class="expense-report-page">
                <h1 class="expense-report-title">費用結報明細表</h1>
                <div class="expense-report-meta"><span>期間：${escapeHtml(formatRocDate(report.startDate))} 至 ${escapeHtml(formatRocDate(report.endDate))}</span><span>第 ${pageIndex+1} 頁／共 ${pageCount} 頁</span></div>
                <table class="expense-detail-table">
                    <colgroup><col style="width:14%"><col style="width:11%"><col style="width:29%">${digitHeaders.map(()=>'<col style="width:5.11%">').join('')}</colgroup>
                    <tbody>
                        <tr><th colspan="2">計 畫 名 稱</th><td colspan="3">${escapeHtml(report.projectName)}</td><th colspan="3">全部計畫或活動經費<br>核定總額</th><td colspan="4" class="digit-cell">${report.totalBudget.toLocaleString()}元</td></tr>
                        <tr><th colspan="12" class="report-section">支　用　內　容</th></tr>
                        <tr><th rowspan="2">憑證<br>號碼</th><th rowspan="2">用途別</th><th rowspan="2">摘　要</th><th colspan="9">金　　　　　　　　　額</th></tr>
                        <tr>${digitHeaders.map(h=>`<th>${h}</th>`).join('')}</tr>
                        ${paddedRows.map((row, idx) => {
                            if (!row) return `<tr class="report-row"><td></td><td></td><td></td>${digitHeaders.map(()=>'<td class="digit-cell"></td>').join('')}</tr>`;
                            const digits = getAmountDigits(row.amount);
                            const number = String(pageIndex * rowsPerPage + idx + 1).padStart(4,'0');
                            return `<tr class="report-row"><td class="digit-cell">${number}</td><td>${escapeHtml(row.category)}</td><td>${escapeHtml(row.summary)}</td>${digits.map(d=>`<td class="digit-cell">${d}</td>`).join('')}</tr>`;
                        }).join('')}
                        <tr><td></td><td></td><th>${totalLabel}</th>${getAmountDigits(totalForRow).map(d=>`<td class="digit-cell">${d}</td>`).join('')}</tr>
                    </tbody>
                </table>
                <div class="expense-signatures"><div>承辦人</div><div>主辦出納</div><div>主辦會計</div><div>負責人</div></div>
            </section>`;
        }

        function generateExpenseDetailReport(rows, projectName, totalBudget, startDate, endDate, periodText) {
            const rowsPerPage = 19;
            const pageCount = Math.max(1, Math.ceil(rows.length / rowsPerPage));
            const report = {
                rows: rows.map((row, index) => ({...row, voucherNo:String(index+1).padStart(4,'0')})),
                projectName,
                totalBudget,
                startDate,
                endDate,
                periodText,
                totalAmount: rows.reduce((sum, row) => sum + (Number(row.amount) || 0), 0)
            };
            state.expenseReport = report;
            state.currentReportType = 'expense-detail';

            const pages = [];
            for (let pageIndex=0; pageIndex<pageCount; pageIndex++) {
                pages.push(buildExpensePageHtml(report.rows.slice(pageIndex*rowsPerPage, (pageIndex+1)*rowsPerPage), pageIndex, pageCount, report));
            }

            const contentDiv = document.getElementById('print-content');
            contentDiv.className = 'expense-report-wrap bg-white mx-auto';
            contentDiv.style.width = '196mm';
            contentDiv.innerHTML = pages.join('');
            setOfficeDownloadButton('excel');
            document.getElementById('report-modal').classList.add('hidden');
            document.getElementById('print-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function downloadExpenseReportExcel() {
            const report = state.expenseReport;
            if (!report) return showToast('請先產生費用結報明細表', 'error');
            if (typeof XLSX === 'undefined') return showToast('Excel 元件尚未載入，請重新整理後再試', 'error');

            const wb = XLSX.utils.book_new();
            const rowsPerPage = 19;
            const pageCount = Math.max(1, Math.ceil(report.rows.length / rowsPerPage));
            const digitHeaders = ['億','仟','佰','拾','萬','仟','佰','拾','元'];
            const border = {style:'thin', color:{rgb:'000000'}};
            const baseFont = {name:'DFKai-SB', sz:11, color:{rgb:'000000'}};
            const center = {horizontal:'center', vertical:'center', wrapText:true};
            const allBorder = {top:border,bottom:border,left:border,right:border};

            for (let pageIndex=0; pageIndex<pageCount; pageIndex++) {
                const pageRows = report.rows.slice(pageIndex*rowsPerPage, (pageIndex+1)*rowsPerPage);
                const data = Array.from({length:29}, () => Array(14).fill(''));
                data[0][0] = '費用結報明細表';
                data[1][0] = `期間：${formatRocDate(report.startDate)} 至 ${formatRocDate(report.endDate)}`;
                data[1][11] = `第 ${pageIndex+1} 頁／共 ${pageCount} 頁`;
                data[2][0] = '計 畫\n名 稱'; data[2][2] = report.projectName;
                data[2][5] = '全部計畫或活動經費核定總額'; data[2][8] = report.totalBudget;
                data[3][0] = '支　用　內　容';
                data[4][0] = '憑證\n號碼'; data[4][1] = '用途別'; data[4][3] = '摘　要'; data[4][4] = '金　　　　　　　　額';
                digitHeaders.forEach((header, i) => data[5][4+i] = header);

                pageRows.forEach((row, rowIndex) => {
                    const target = 6 + rowIndex;
                    data[target][0] = String(pageIndex*rowsPerPage + rowIndex + 1).padStart(4,'0');
                    data[target][1] = row.category;
                    data[target][3] = row.summary;
                    getAmountDigits(row.amount).forEach((digit, i) => data[target][4+i] = digit);
                    data[target][13] = Number(row.amount) || 0;
                });

                const isLast = pageIndex === pageCount-1;
                const pageSubtotal = pageRows.reduce((sum,row)=>sum+(Number(row.amount)||0),0);
                const totalValue = isLast ? report.totalAmount : pageSubtotal;
                data[25][3] = isLast ? '合計' : '本頁小計';
                getAmountDigits(totalValue).forEach((digit, i) => data[25][4+i] = digit);
                data[25][13] = totalValue;
                data[27][0] = '承辦人'; data[27][3] = '主辦出納'; data[27][6] = '主辦會計'; data[27][9] = '負責人';

                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!merges'] = [
                    {s:{r:0,c:0},e:{r:0,c:12}}, {s:{r:1,c:0},e:{r:1,c:10}}, {s:{r:1,c:11},e:{r:1,c:12}},
                    {s:{r:2,c:0},e:{r:2,c:1}}, {s:{r:2,c:2},e:{r:2,c:4}}, {s:{r:2,c:5},e:{r:2,c:7}}, {s:{r:2,c:8},e:{r:2,c:12}},
                    {s:{r:3,c:0},e:{r:3,c:12}}, {s:{r:4,c:0},e:{r:5,c:0}}, {s:{r:4,c:1},e:{r:5,c:2}},
                    {s:{r:4,c:3},e:{r:5,c:3}}, {s:{r:4,c:4},e:{r:4,c:12}},
                    ...Array.from({length:19},(_,i)=>({s:{r:6+i,c:1},e:{r:6+i,c:2}})),
                    {s:{r:27,c:0},e:{r:27,c:2}}, {s:{r:27,c:3},e:{r:27,c:5}}, {s:{r:27,c:6},e:{r:27,c:8}}, {s:{r:27,c:9},e:{r:27,c:12}}
                ];
                ws['!cols'] = [{wch:11},{wch:5},{wch:5},{wch:28},...Array.from({length:9},()=>({wch:3.2})),{hidden:true}];
                ws['!rows'] = [{hpt:28},{hpt:20},{hpt:38},{hpt:24},{hpt:22},{hpt:20},...Array.from({length:19},()=>({hpt:23})),{hpt:24},{hpt:8},{hpt:24},{hpt:52}];
                ws['!margins'] = {left:0.3,right:0.3,top:0.35,bottom:0.35,header:0,footer:0};
                ws['!pageSetup'] = {paperSize:9, orientation:'portrait', fitToWidth:1, fitToHeight:1};

                const range = XLSX.utils.decode_range(ws['!ref']);
                for (let r=0; r<=range.e.r; r++) for (let c=0; c<=12; c++) {
                    const ref = XLSX.utils.encode_cell({r,c});
                    if (!ws[ref]) ws[ref] = {t:'s',v:''};
                    ws[ref].s = {font:{...baseFont}, alignment:{vertical:'center', wrapText:true}};
                }
                ws['A1'].s = {font:{name:'DFKai-SB',sz:20,bold:true},alignment:center};
                ['A2','L2'].forEach(ref=>ws[ref].s={font:{...baseFont,sz:12},alignment:center});
                for (let r=2; r<=25; r++) for (let c=0; c<=12; c++) {
                    const ref=XLSX.utils.encode_cell({r,c});
                    ws[ref].s={font:{...baseFont},alignment:{...center,horizontal:c===3&&r>=6&&r<=24?'left':'center'},border:allBorder};
                }
                ws['A4'].s={font:{...baseFont,sz:13,bold:true},alignment:center,border:allBorder};
                ['A28','D28','G28','J28'].forEach(ref=>ws[ref].s={font:{...baseFont,sz:12},alignment:center});
                ws['I3'].t='n'; ws['I3'].z='#,##0"元"';
                XLSX.utils.book_append_sheet(wb, ws, `第${pageIndex+1}頁`);
            }

            const safeName = report.projectName.replace(/[\\/:*?"<>|]/g,'_').slice(0,40) || '費用結報明細表';
            XLSX.writeFile(wb, `${safeName}_費用結報明細表.xlsx`);
            showToast('Excel 下載成功');
        }

        // --- Data Operations ---
        
        document.getElementById('entry-form').onsubmit = async (e) => { 
            e.preventDefault(); 
            if(!state.apiUrl) return showToast('請先連線','error'); 
            
            const isEdit=document.getElementById('inp-id').value!==""; 
            const btn=document.getElementById('btn-submit'); 
            btn.disabled=true;
            
            let rawBankAcc = document.getElementById('inp-bank-account').value.trim();
            if(rawBankAcc && rawBankAcc.length > 0 && rawBankAcc.length < 14 && /^\d+$/.test(rawBankAcc)) {
                rawBankAcc = rawBankAcc.padStart(14, '0');
            }

            const formData={ 
                action: isEdit?'edit':'add', 
                id: isEdit?document.getElementById('inp-id').value:Date.now().toString(), 
                date:document.getElementById('inp-date').value, 
                type:document.getElementById('inp-type').value, 
                projectId:document.getElementById('inp-project').value, 
                category:document.getElementById('inp-category').value, 
                summary:document.getElementById('inp-summary').value, 
                amount:document.getElementById('inp-amount').value, 
                payee:document.getElementById('inp-payee').value, 
                bankAccount: rawBankAcc, 
                note:document.getElementById('inp-note').value, 
                createdBy:state.currentUser.id
            }; 

            if (formData.type === 'expense') {
                const project = state.projects.find(p => String(p.id) === String(formData.projectId));
                const budget = Number(project?.budget) || 0;
                const editingRecord = isEdit ? state.transactions.find(t => String(t.id) === String(formData.id)) : null;
                const currentUsed = state.transactions
                    .filter(t => String(t.projectId) === String(formData.projectId) && t.type === 'expense' && (!editingRecord || String(t.id) !== String(editingRecord.id)))
                    .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
                const projectedUsed = currentUsed + Number(formData.amount);
                if (project && (budget <= 0 || projectedUsed > budget)) {
                    const warning = budget <= 0
                        ? `「${project.name}」尚未設定預算，仍要儲存這筆支出嗎？`
                        : `儲存後「${project.name}」將超支 $${(projectedUsed-budget).toLocaleString()}，仍要繼續嗎？`;
                    if (!confirm(warning)) { btn.disabled=false; return; }
                }
                btn.disabled=false;
                openPurchaseItemModal(formData);
                return;
            }
            formData.items=[];
            formData.paymentType='vendor';
            formData.payerName='';
            try { await persistRecord(formData, false); } finally { btn.disabled=false; }
        };

        function buildPurposeDescription(transaction) {
            const project = state.projects.find(p => String(p.id) === String(transaction.projectId));
            return [project?.name || '', transaction.category || '', transaction.summary || ''].filter(Boolean).join('－');
        }

        function openPurchaseItemModal(formData) {
            state.pendingRecord = formData;
            const project = state.projects.find(p => String(p.id) === String(formData.projectId));
            const category = state.categories.find(c => String(c.name) === String(formData.category) && c.type === 'expense');
            const oldItems = state.transactionItems.filter(item => String(item.transactionId) === String(formData.id)).sort((a,b)=>Number(a.lineNo)-Number(b.lineNo));
            const oldTransaction = state.transactions.find(t => String(t.id) === String(formData.id));
            state.pendingPurchaseItems = oldItems.length ? oldItems.map(item => ({itemName:item.itemName,unit:item.unit,quantity:Number(item.quantity),unitPrice:Number(item.unitPrice)}))
                : [{itemName:formData.summary || '', unit:'式', quantity:1, unitPrice:Number(formData.amount) || 0}];
            document.getElementById('purchase-work-plan').innerText = project?.workPlan || project?.name || '（請在 Projects 填寫 workPlan）';
            document.getElementById('purchase-purpose-code').innerText = category?.purposeCode || category?.name || '（請在 Categories 填寫 purposeCode）';
            document.getElementById('purchase-target-amount').innerText = `$${Number(formData.amount).toLocaleString()}`;
            document.getElementById('purchase-purpose-description').innerText = buildPurposeDescription(formData);
            document.getElementById('purchase-items-target').innerText = `$${Number(formData.amount).toLocaleString()}`;
            document.getElementById('purchase-payment-type').value = oldTransaction?.paymentType || 'prepaid';
            document.getElementById('purchase-payer-name').value = oldTransaction?.payerName || state.currentUser?.name || '';
            renderPurchaseItemRows();
            togglePayerName();
            document.getElementById('purchase-item-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closePurchaseItemModal() {
            document.getElementById('purchase-item-modal').classList.add('hidden');
            state.pendingRecord = null;
        }

        function renderPurchaseItemRows() {
            const body = document.getElementById('purchase-items-body');
            body.innerHTML = state.pendingPurchaseItems.map((item,index)=>`<tr class="border-t" data-index="${index}">
                <td class="p-2 text-center">${index+1}</td>
                <td class="p-1"><input data-field="itemName" maxlength="150" value="${escapeHtml(item.itemName)}" class="w-full p-2 border rounded" placeholder="品名或規格"></td>
                <td class="p-1"><input data-field="unit" maxlength="30" value="${escapeHtml(item.unit)}" class="w-full p-2 border rounded text-center" placeholder="式"></td>
                <td class="p-1"><input data-field="quantity" type="number" min="0.01" step="0.01" value="${Number(item.quantity)}" oninput="updatePurchaseItemTotals()" class="w-full p-2 border rounded text-right"></td>
                <td class="p-1"><input data-field="unitPrice" type="number" min="0" step="0.01" value="${Number(item.unitPrice)}" oninput="updatePurchaseItemTotals()" class="w-full p-2 border rounded text-right"></td>
                <td class="p-2 text-right font-mono item-line-total">$0</td>
                <td class="p-1 text-center"><button type="button" onclick="removePurchaseItemRow(${index})" class="text-red-500 p-2" title="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
            </tr>`).join('');
            updatePurchaseItemTotals();
            lucide.createIcons();
        }

        function syncPurchaseItemsFromInputs() {
            return [...document.querySelectorAll('#purchase-items-body tr')].map(row => ({
                itemName:row.querySelector('[data-field="itemName"]').value.trim(), unit:row.querySelector('[data-field="unit"]').value.trim(),
                quantity:Number(row.querySelector('[data-field="quantity"]').value), unitPrice:Number(row.querySelector('[data-field="unitPrice"]').value)
            }));
        }

        function updatePurchaseItemTotals() {
            const rows = [...document.querySelectorAll('#purchase-items-body tr')];
            let total=0;
            rows.forEach(row=>{ const q=Number(row.querySelector('[data-field="quantity"]').value)||0; const p=Number(row.querySelector('[data-field="unitPrice"]').value)||0; const line=Math.round(q*p*100)/100; total+=line; row.querySelector('.item-line-total').innerText=`$${line.toLocaleString()}`; });
            const target=Number(state.pendingRecord?.amount)||0;
            const el=document.getElementById('purchase-items-total');
            el.innerText=`$${total.toLocaleString()}`;
            el.className=`font-mono text-xl ${Math.abs(total-target)<0.009?'text-green-700':'text-red-700'}`;
        }

        function addPurchaseItemRow() {
            state.pendingPurchaseItems=syncPurchaseItemsFromInputs();
            if(state.pendingPurchaseItems.length>=10) return showToast('單張最多 10 筆品項','error');
            state.pendingPurchaseItems.push({itemName:'',unit:'式',quantity:1,unitPrice:0}); renderPurchaseItemRows();
        }

        function removePurchaseItemRow(index) {
            state.pendingPurchaseItems=syncPurchaseItemsFromInputs();
            if(state.pendingPurchaseItems.length<=1) return showToast('至少保留一筆品項','error');
            state.pendingPurchaseItems.splice(index,1); renderPurchaseItemRows();
        }

        function togglePayerName() {
            document.getElementById('purchase-payer-wrap').classList.toggle('hidden', document.getElementById('purchase-payment-type').value !== 'prepaid');
        }

        async function confirmPurchaseDetails() {
            const record=state.pendingRecord;
            if(!record) return;
            const items=syncPurchaseItemsFromInputs();
            if(items.some(item=>!item.itemName||!item.unit||!(item.quantity>0)||item.unitPrice<0)) return showToast('請完整填寫每筆品名、單位、數量與單價','error');
            const total=items.reduce((sum,item)=>sum+Math.round(item.quantity*item.unitPrice*100)/100,0);
            if(Math.abs(total-Number(record.amount))>0.009) return showToast(`明細合計 $${total.toLocaleString()} 與支出金額不一致`,'error');
            record.items=items;
            record.paymentType=document.getElementById('purchase-payment-type').value;
            record.payerName=document.getElementById('purchase-payer-name').value.trim();
            if(record.paymentType==='prepaid'&&!record.payerName) return showToast('請輸入墊付人','error');
            const btn=document.getElementById('btn-save-purchase'); btn.disabled=true;
            try { if (await persistRecord(record, true)) document.getElementById('purchase-item-modal').classList.add('hidden'); }
            finally { btn.disabled=false; }
        }

        async function persistRecord(formData, showPurchaseAfterSave) {
            const isEdit=formData.action==='edit';
            try {
                showLoading(true); await apiCall(formData);
                const idx=state.transactions.findIndex(t=>String(t.id)===String(formData.id));
                const localRecord={...formData,createdBy:idx>=0?state.transactions[idx].createdBy:state.currentUser.id}; delete localRecord.items;
                if(idx>=0) state.transactions[idx]=localRecord; else state.transactions.unshift(localRecord);
                state.transactionItems=state.transactionItems.filter(item=>String(item.transactionId)!==String(formData.id));
                (formData.items||[]).forEach((item,index)=>state.transactionItems.push({...item,transactionId:formData.id,lineNo:index+1,total:Math.round(item.quantity*item.unitPrice*100)/100}));
                updateUI(); cancelEdit(); state.pendingRecord=null; showToast('儲存成功');
                if(showPurchaseAfterSave) showPurchaseFormPreview(localRecord);
                return true;
            } catch(err) { showToast('儲存失敗：'+err.message,'error'); console.error(err); return false; }
            finally { showLoading(false); }
        }

        function getPurchaseFormData(transaction) {
            const project=state.projects.find(p=>String(p.id)===String(transaction.projectId))||{};
            const category=state.categories.find(c=>String(c.name)===String(transaction.category)&&c.type==='expense')||{};
            const items=state.transactionItems.filter(item=>String(item.transactionId)===String(transaction.id)).sort((a,b)=>Number(a.lineNo)-Number(b.lineNo));
            return {transaction,items,projectName:project.name||'',workPlan:project.workPlan||project.name||'',purposeCode:category.purposeCode||category.name||transaction.category||'',purposeDescription:buildPurposeDescription(transaction)};
        }

        function paymentChoiceText(form) {
            const type=form.transaction.paymentType||'prepaid', payer=form.transaction.payerName||state.currentUser?.name||'';
            return `${type==='vendor'?'●':'○'}逕付具領人或廠商　　${type==='prepaid'?'●':'○'}款項已由 ${escapeHtml(payer)} 先行墊付　　${type==='advance'?'●':'○'}已預借費用`;
        }

        function amountToChinese(value) {
            const amount=Math.max(0,Math.round(Number(value)||0));
            if(amount===0) return '新台幣零元整';
            const digit=['零','壹','貳','參','肆','伍','陸','柒','捌','玖'], units=['','拾','佰','仟'], big=['','萬','億','兆'];
            let n=amount, groups=[];
            while(n>0){groups.push(n%10000);n=Math.floor(n/10000);}
            let out='', pendingZero=false;
            for(let g=groups.length-1;g>=0;g--){const group=groups[g];if(!group){pendingZero=!!out;continue;}if((pendingZero||group<1000)&&out&&!out.endsWith('零'))out+='零';let part='',innerZero=false;for(let pos=3;pos>=0;pos--){const d=Math.floor(group/Math.pow(10,pos))%10;if(d){if(innerZero&&part)part+='零';part+=digit[d]+units[pos];innerZero=false;}else if(part)innerZero=true;}out+=part+big[g];pendingZero=false;}
            return `新台幣${out}元整`;
        }
